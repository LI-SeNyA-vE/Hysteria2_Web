name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Vite output
        uses: actions/cache@v4
        id: vite-cache
        with:
          path: frontend/dist
          key: vite-${{ hashFiles('frontend/src/**', 'frontend/index.html', 'frontend/vite.config.*', 'frontend/package-lock.json') }}

      - name: Set up Node.js
        if: steps.vite-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: steps.vite-cache.outputs.cache-hit != 'true'
        run: cd frontend && npm ci && npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build:
    name: Build binary
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags="-s -w -X hysteria2-web/internal/version.Version=${{ github.ref_name }}" \
            -o panel-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/panel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: panel-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/panel-*
            install.sh
          generate_release_notes: true
          body: |
            ## Установка

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh | sudo bash
            ```

            ## Бинари

            | ОС | Архитектура | Файл |
            |---|---|---|
            | Linux | amd64 (x86_64) | `panel-linux-amd64` |
            | Linux | arm64 (aarch64) | `panel-linux-arm64` |
